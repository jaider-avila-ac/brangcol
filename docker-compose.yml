name: brangcol

# La base de datos no va aqui: corre en su propio stack (repositorio brangol_basedatos).
#   docker compose up -d --build                          -> solo el backend
#   docker compose --profile observabilidad up -d --build -> backend con Prometheus, Grafana y Loki

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: ${DB_URL_DOCKER:-jdbc:postgresql://host.docker.internal:5433/brangcol}
    ports:
      - "${PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [observabilidad]
    restart: unless-stopped
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.7.7
    profiles: [observabilidad]
    restart: unless-stopped
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.20.0
    profiles: [observabilidad]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./observabilidad/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.0.9
    profiles: [observabilidad]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observabilidad/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
