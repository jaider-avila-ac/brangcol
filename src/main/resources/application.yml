spring:
  application:
    name: brangcol
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/brangcol}
    username: ${DB_USERNAME:brangcol_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: brangcol

logging:
  structured:
    format:
      console: ${LOG_FORMATO:ecs}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${ENTORNO:desarrollo}
  send-default-pii: false

brangcol:
  sesion:
    cookie: bc_sesion
    cookie-segura: ${COOKIE_SEGURA:true}
